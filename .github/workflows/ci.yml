name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: packages/shared - typecheck & test
        run: |
          pnpm --filter @attendance/shared typecheck
          pnpm --filter @attendance/shared test

      - name: workers/api - typecheck & test
        run: |
          pnpm --filter @attendance/api typecheck
          pnpm --filter @attendance/api test

      - name: apps/web - typecheck & test
        run: |
          pnpm --filter @attendance/web typecheck
          pnpm --filter @attendance/web test

      - name: apps/web - build
        run: pnpm --filter @attendance/web build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @attendance/web build

      - name: Apply D1 migrations (remote)
        working-directory: workers/api
        run: npx wrangler d1 migrations apply attendance-manager-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        working-directory: workers/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
