name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: packages/shared - typecheck & test
        run: |
          pnpm --filter @attendance/shared typecheck
          pnpm --filter @attendance/shared test

      - name: apps/web - typecheck & test
        run: |
          pnpm --filter @attendance/web typecheck
          pnpm --filter @attendance/web test

      - name: apps/web - build
        run: pnpm --filter @attendance/web build

      # workers/apiのテスト(vitest-plugin)はwrangler.jsoncのassets.directoryが
      # 実在することを前提にするため、apps/webのビルドより後に実行する必要がある
      - name: workers/api - typecheck & test
        run: |
          pnpm --filter @attendance/api typecheck
          pnpm --filter @attendance/api test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @attendance/web build

      # 本番のドメイン等は公開リポジトリに含めないため、GitHub Secretsからwrangler.jsoncへ差し込む
      - name: Inject production values into wrangler.jsonc
        working-directory: workers/api
        env:
          PROD_HOSTNAME: ${{ secrets.PROD_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          sed -i \
            -e "s|attendance-manager\.example\.com|${PROD_HOSTNAME:?}|" \
            -e "s|example\.cloudflareaccess\.com|${ACCESS_TEAM_DOMAIN:?}|" \
            wrangler.jsonc
          ! grep -nE "example\.(com|cloudflareaccess)" wrangler.jsonc

      - name: Apply D1 migrations (remote)
        working-directory: workers/api
        run: npx wrangler d1 migrations apply attendance-manager-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        working-directory: workers/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
